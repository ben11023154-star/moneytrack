<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1D4ED8"><title>MoneyTrack Budget</title><style>:root{--bg:#F3F7FC;--card:#fff;--text:#172033;--muted:#64748B;--line:#DCE5F0;--blue:#1D4ED8;--green:#059669;--red:#DC2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:25px;font-weight:850}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #1d4ed808}.hero{background:linear-gradient(135deg,#1D4ED8,#2563EB);color:#fff;border:0}.hero .muted{color:#DBEAFE}.hero .stat .muted{color:#64748B}.hero .stat b{color:#172033}.hero .stat b.overtext{color:#DC2626}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#F7FAFF;border-radius:14px;padding:13px}.hero .stat{background:#fff}.stat b{display:block;font-size:24px;margin-top:3px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}button,input{font:inherit;padding:11px;border-radius:11px;border:1px solid #CBD5E1}button{background:var(--blue);color:#fff;border:0;font-weight:750;cursor:pointer}.secondary{background:#E8F0FF;color:#1E40AF}.budget-row{padding:15px 0;border-bottom:1px solid var(--line)}.budget-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.bar{height:10px;background:#E2E8F0;border-radius:8px;overflow:hidden;margin-top:9px}.fill{height:100%;background:linear-gradient(90deg,#2563EB,#60A5FA);border-radius:8px}.fill.over{background:var(--red)}.tiny{font-size:12px}.category{font-weight:800}.amounts{display:flex;justify-content:space-between;margin-top:5px}.overtext{color:var(--red);font-weight:750}.oktext{color:var(--green);font-weight:750}.hidden{display:none!important}@media(max-width:650px){.app{padding:12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.row{flex-wrap:wrap}.row>*{min-width:130px}.budget-head{align-items:flex-start}}</style></head><body><div class="app"><div class="top"><div><div class="brand">MoneyTrack</div><div class="muted">Monthly budget</div></div><button class="secondary" onclick="location.href='./'">Back to MoneyTrack</button></div><div id="auth" class="card"><h2>Log in to use your budget</h2><p class="muted">Use the same MoneyTrack account.</p><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"></div><button onclick="login()">Log in</button><p id="msg" class="muted"></p></div><main id="main" class="hidden"><div class="card hero"><div class="row"><div><div class="muted tiny">MONTHLY BUDGET</div><h2 id="monthTitle">Budget</h2></div><input id="month" type="month" onchange="loadData()" style="max-width:170px"></div><div class="grid" style="margin-top:14px"><div class="stat"><span class="muted tiny">BUDGETED</span><b id="budgeted">£0</b></div><div class="stat"><span class="muted tiny">SPENT</span><b id="spentTotal">£0</b></div><div class="stat"><span class="muted tiny">REMAINING</span><b id="remaining">£0</b></div></div><div class="tiny" id="heroNote" style="margin-top:12px">Set category limits below.</div></div><div class="card"><h2>Set your budget</h2><p class="muted">Your limits are saved securely to your MoneyTrack account and follow you across devices.</p><div id="editor"></div><button onclick="saveBudgets()">Save budget</button><p id="saveMsg" class="muted"></p></div><div class="card"><h2>Budget progress</h2><div id="progress"></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://nexrjaddzcatgwojmbfv.supabase.co','sb_publishable_FLhvbRPJb5QMfGYug0R0RA_5oJr90dg');let uid,tx=[],budgets={};const cats=['Housing','Bills','Food','Transport','Shopping','Entertainment','Health','Other'];const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);function login(){sb.auth.signInWithPassword({email:email.value.trim(),password:password.value}).then(r=>{if(r.error){msg.textContent=r.error.message;return}start(r.data.user)})}async function start(u){uid=u.id;auth.classList.add('hidden');main.classList.remove('hidden');month.value=new Date().toISOString().slice(0,7);await loadData()}async function loadData(){if(!uid)return;let m=month.value+'-01';let next=new Date(month.value+'-01');next.setMonth(next.getMonth()+1);let t=await sb.from('money_transactions').select('*').eq('user_id',uid).gte('transaction_date',m).lt('transaction_date',next.toISOString().slice(0,10)).eq('type','expense');tx=t.data||[];let b=await sb.from('money_budgets').select('category,amount').eq('user_id',uid).eq('month',m);if(b.error){saveMsg.textContent='Budget database not available: '+b.error.message;budgets={};}else{budgets={};(b.data||[]).forEach(x=>budgets[x.category]=Number(x.amount)||0)}render()}function spentCat(c){return tx.filter(x=>(x.category||'Other')===c).reduce((s,x)=>s+Number(x.amount||0),0)}function render(){monthTitle.textContent=new Date(month.value+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'});editor.innerHTML=cats.map(c=>`<div class="budget-row"><div class="budget-head"><span class="category">${c}</span><input class="budget-input" data-cat="${c}" type="number" min="0" step="1" placeholder="0" value="${budgets[c]??''}" style="max-width:150px" aria-label="${c} budget"></div></div>`).join('');let total=Object.values(budgets).reduce((s,v)=>s+Number(v||0),0),spent=tx.reduce((s,x)=>s+Number(x.amount||0),0),left=total-spent;budgeted.textContent=money(total);spentTotal.textContent=money(spent);remaining.textContent=money(left);remaining.className=left<0?'overtext':'';heroNote.textContent=total?(left>=0?`${money(left)} remaining across your planned categories.`:`You are ${money(Math.abs(left))} over your total monthly budget.`):'Set category limits below.';progress.innerHTML=cats.map(c=>{let b=Number(budgets[c]||0),s=spentCat(c),pct=b?Math.min(100,s/b*100):0,over=b&&s>b;return `<div class="budget-row"><div class="budget-head"><span class="category">${c}</span><span class="tiny ${over?'overtext':'oktext'}">${money(s)} ${b?'of '+money(b):'spent'}</span></div><div class="bar"><div class="fill ${over?'over':''}" style="width:${over?100:pct}%"></div></div><div class="amounts tiny"><span>${b?Math.round(s/b*100)+'% used':'No budget set'}</span><span>${b?(over?money(s-b)+' over':money(b-s)+' left'):''}</span></div></div>`}).join('')}async function saveBudgets(){let m=month.value+'-01';let rows=cats.map(c=>({user_id:uid,month:m,category:c,amount:Number(document.querySelector(`[data-cat="${CSS.escape(c)}"]`).value||0)}));saveMsg.textContent='Saving…';let r=await sb.from('money_budgets').upsert(rows,{onConflict:'user_id,month,category'});if(r.error){saveMsg.textContent='Could not save budget: '+r.error.message;return}budgets={};rows.forEach(x=>budgets[x.category]=x.amount);saveMsg.textContent='Budget saved to your MoneyTrack account.';render()}sb.auth.getSession().then(r=>{if(r.data.session)start(r.data.session.user)});</script></body></html>
